
   
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dheeraj's 100x Interview Bot</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; color:#222; }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px; text-align:center; }
    h1 { font-size:24px; margin-bottom:6px; }
    p.sub { color:#555; margin-top:0; }
    button { border:0; border-radius:8px; padding:12px 20px; font-size:16px; cursor:pointer; }
    .langs { display:flex; gap:8px; justify-content:center; margin:12px 0; }
    .lang { background:#e5e7eb; color:#222; }
    .lang.sel { background:#111827; color:#fff; }
    #callBtn { background:#2563eb; color:#fff; }
    #callBtn.live { background:#dc2626; }
    #status { margin:10px 0; color:#555; font-size:14px; min-height:20px; }
    #chat { background:#fff; border-radius:10px; height:300px; overflow-y:auto; padding:12px; text-align:left; border:1px solid #e3e7ef; display:flex; flex-direction:column; }
    .msg { margin:6px 0; padding:8px 12px; border-radius:10px; max-width:85%; line-height:1.4; white-space:pre-wrap; }
    .user { background:#dbeafe; align-self:flex-end; }
    .bot { background:#eef0f4; align-self:flex-start; }
    .row { display:flex; gap:8px; margin-top:12px; }
    #txt { flex:1; padding:12px; font-size:16px; border:1px solid #cfd5e2; border-radius:8px; }
    #sendBtn { background:#16a34a; color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    small { color:#9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Talk to Dheeraj's 100x Interview Bot</h1>
    <p class="sub">Choose a language, click Start Call, allow the microphone, then speak or type. Earphones give the best result.</p>
    <div class="langs">
      <button class="lang sel" id="enBtn">English</button>
      <button class="lang" id="teBtn">తెలుగు</button>
    </div>
    <button id="callBtn">Start Call</button>
    <div id="status">Not connected</div>
    <div id="chat"></div>
    <div class="row">
      <input id="txt" type="text" placeholder="Type a message (after starting the call)" disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
    <small>v4</small>
  </div>

  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web@2.3.8";

    const ASSISTANT_ID = "5ec1bb38-90f2-47b5-8162-82c2373f2f04";
    const PUBLIC_KEY = "065cc7b1-2408-4b4e-986c-dd39c649af49";

    // OPTIONAL: paste an ElevenLabs voice ID here for a more human voice (used for both languages)
    const ELEVEN_VOICE_ID = "";

    // How the voice should say the name. If it says it wrongly, try "Dheeraaj" or "Dhee-raj"
    const SPOKEN_NAME = "Dheeraj";

    // If your own speech does not appear in the chat, set this to false to use the transcriber set in the Vapi dashboard
    const USE_TRANSCRIBER_OVERRIDE = true;

    const CONFIG = {
      en: {
        firstMessage: `Hi, my name is ${SPOKEN_NAME} Gundapuneni, you can call me Dheeru. Ask me anything about my background and projects.`,
        transcriber: {
          provider: "deepgram",
          model: "nova-2",
          language: "en-IN",
          keywords: ["Dheeraj:5", "Gundapuneni:5", "Dheeru:5"]
        },
        azureVoice: "en-IN-PrabhatNeural",
        note: "Your name is Dheeraj Gundapuneni, also called Dheeru. You are Dheeraj himself, speaking in first person. Never use any other name such as Dinesh or Dheeras. If the user's text spells your name differently, still treat it as Dheeraj. Reply only in natural, simple Indian English, in 1 to 3 short sentences, like a friendly young engineer from Hyderabad. Sound human and relaxed. Use small natural fillers like 'so', 'actually', 'see'. Never sound like you are reading."
      },
      te: {
        firstMessage: "నమస్కారం! నా పేరు ధీరజ్ గుండపునేని, నన్ను ధీరు అని పిలవచ్చు. నా గురించి ఏమైనా అడగండి.",
        transcriber: { provider: "google", language: "Telugu" },
        azureVoice: "te-IN-MohanNeural",
        note: "Your name is Dheeraj Gundapuneni, also called Dheeru. You are Dheeraj himself, speaking in first person. Never use any other name such as Dinesh or Dheeras. Reply only in natural spoken Telugu, written in Telugu script, in 1 to 3 short sentences, like a friendly person from Hyderabad. Keep technical words like Python, NLP, LLM in English. Sound casual and human, not formal or bookish."
      }
    };

    let lang = "en";
    const vapi = new Vapi(PUBLIC_KEY);
    const callBtn = document.getElementById("callBtn");
    const sendBtn = document.getElementById("sendBtn");
    const txt = document.getElementById("txt");
    const chat = document.getElementById("chat");
    const statusEl = document.getElementById("status");
    const enBtn = document.getElementById("enBtn");
    const teBtn = document.getElementById("teBtn");
    let live = false;

    // ---- chat: one bubble per speaking turn ----
    let curRole = null;
    let curEl = null;
    let committed = "";

    function newBubble(role) {
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "user" : "bot");
      chat.appendChild(d);
      return d;
    }

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function onTranscript(role, text, isFinal) {
      if (!text) return;
      const r = role === "user" ? "user" : "bot";
      if (r !== curRole) {
        curRole = r;
        committed = "";
        curEl = newBubble(r);
      }
      if (isFinal) {
        committed = (committed + " " + text).trim();
        curEl.textContent = committed;
      } else {
        curEl.textContent = (committed + " " + text).trim();
      }
      scrollDown();
    }

    function addTyped(text) {
      const d = newBubble("user");
      d.textContent = text;
      curRole = null;      // next voice message starts a fresh bubble
      curEl = null;
      committed = "";
      scrollDown();
    }

    // ---- language buttons ----
    function pickLang(l) {
      if (live) return;
      lang = l;
      enBtn.classList.toggle("sel", l === "en");
      teBtn.classList.toggle("sel", l === "te");
    }
    enBtn.onclick = () => pickLang("en");
    teBtn.onclick = () => pickLang("te");

    function setLive(v) {
      live = v;
      callBtn.textContent = v ? "End Call" : "Start Call";
      callBtn.classList.toggle("live", v);
      txt.disabled = !v;
      sendBtn.disabled = !v;
      enBtn.disabled = v;
      teBtn.disabled = v;
      statusEl.textContent = v ? "Connected - speak or type" : "Not connected";
    }

    function buildOverrides() {
      const c = CONFIG[lang];
      const voice = ELEVEN_VOICE_ID
        ? { provider: "11labs", voiceId: ELEVEN_VOICE_ID, model: "eleven_multilingual_v2", stability: 0.4, similarityBoost: 0.8 }
        : { provider: "azure", voiceId: c.azureVoice };
      const o = {
        firstMessage: c.firstMessage,
        voice: voice,
        maxDurationSeconds: 300,
        backchannelingEnabled: true,
        responseDelaySeconds: 0.3
      };
      if (USE_TRANSCRIBER_OVERRIDE) o.transcriber = c.transcriber;
      return o;
    }

    callBtn.onclick = () => {
      if (live) { vapi.stop(); return; }
      chat.innerHTML = "";
      curRole = null; curEl = null; committed = "";
      statusEl.textContent = "Connecting...";
      vapi.start(ASSISTANT_ID, buildOverrides());
    };

    function sendText() {
      const t = txt.value.trim();
      if (!t || !live) return;
      vapi.send({ type: "add-message", message: { role: "user", content: t } });
      addTyped(t);
      txt.value = "";
    }
    sendBtn.onclick = sendText;
    txt.addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });

    // ---- Vapi events ----
    vapi.on("call-start", () => {
      setLive(true);
      vapi.send({ type: "add-message", message: { role: "system", content: CONFIG[lang].note } });
    });
    vapi.on("call-end", () => setLive(false));
    vapi.on("speech-start", () => { if (live) statusEl.textContent = "Bot is speaking..."; });
    vapi.on("speech-end", () => { if (live) statusEl.textContent = "Listening... you can speak"; });
    vapi.on("error", e => {
      console.error(e);
      statusEl.textContent = "Error - press F12 and check the console";
      setLive(false);
    });
    vapi.on("message", m => {
      if (m.type === "transcript") {
        onTranscript(m.role, m.transcript, m.transcriptType === "final");
      }
    });
  </script>
</body>
</html>
